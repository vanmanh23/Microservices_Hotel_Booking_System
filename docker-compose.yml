version: '3.9'

services:

  # ── Databases (Database-per-Service) ──────────────────────────
  postgres-user:
    image: postgres:17
    container_name: postgres-user
    restart: unless-stopped
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
    networks:
      - booking-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-hotel:
    image: postgres:17
    container_name: postgres-hotel
    restart: unless-stopped
    environment:
      POSTGRES_DB: hotel_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5433:5432"
    volumes:
      - postgres-hotel-data:/var/lib/postgresql/data
    networks:
      - booking-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d hotel_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-booking:
    image: postgres:17
    container_name: postgres-booking
    restart: unless-stopped
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5434:5432"
    volumes:
      - postgres-booking-data:/var/lib/postgresql/data
    networks:
      - booking-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d booking_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-payment:
    image: postgres:17
    container_name: postgres-payment
    restart: unless-stopped
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5435:5432"
    volumes:
      - postgres-payment-data:/var/lib/postgresql/data
    networks:
      - booking-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d payment_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-review:
    image: postgres:17
    container_name: postgres-review
    restart: unless-stopped
    environment:
      POSTGRES_DB: review_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5436:5432"
    volumes:
      - postgres-review-data:/var/lib/postgresql/data
    networks:
      - booking-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d review_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Infrastructure ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - booking-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - booking-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - booking-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres-user
    networks:
      - booking-network

  # ── Microservices ─────────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: auth_service/Dockerfile
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      SERVER_PORT: 8086
      DB_URL: jdbc:postgresql://postgres-user:5432/user_db
      DB_USERNAME: admin
      DB_PASSWORD: admin123
      JWT_SECRET: your-256-bit-secret-key-change-in-production-env
    depends_on:
      postgres-user:
        condition: service_healthy
    networks:
      - booking-network

  hotel-service:
    build:
      context: .
      dockerfile: hotel-service/Dockerfile
    container_name: hotel-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres-hotel:5432/hotel_db
      DB_USERNAME: admin
      DB_PASSWORD: admin123
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres-hotel:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - booking-network

  booking-service:
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    container_name: booking-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://postgres-booking:5432/booking_db
      DB_USERNAME: admin
      DB_PASSWORD: admin123
      HOTEL_SERVICE_URL: http://hotel-service:8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres-booking:
        condition: service_healthy
      hotel-service:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - booking-network

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: payment-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://postgres-payment:5432/payment_db
      DB_USERNAME: admin
      DB_PASSWORD: admin123
      BOOKING_SERVICE_URL: http://booking-service:8082
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres-payment:
        condition: service_healthy
      booking-service:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - booking-network

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - booking-network

  review-service:
    build:
      context: .
      dockerfile: review-service/Dockerfile
    container_name: review-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      DB_URL: jdbc:postgresql://postgres-review:5432/review_db
      DB_USERNAME: admin
      DB_PASSWORD: admin123
      BOOKING_SERVICE_URL: http://booking-service:8082
    depends_on:
      postgres-review:
        condition: service_healthy
      booking-service:
        condition: service_started
    networks:
      - booking-network

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:8086
      HOTEL_SERVICE_URL: http://hotel-service:8081
      BOOKING_SERVICE_URL: http://booking-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8083
      REVIEW_SERVICE_URL: http://review-service:8085
    depends_on:
      - auth-service
      - hotel-service
      - booking-service
      - payment-service
      - review-service
    networks:
      - booking-network

networks:
  booking-network:
    driver: bridge

volumes:
  postgres-user-data:
  postgres-hotel-data:
  postgres-booking-data:
  postgres-payment-data:
  postgres-review-data:
