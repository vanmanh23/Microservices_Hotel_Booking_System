server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/auth/**
        - id: user-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/users/**
        - id: hotel-service
          uri: ${HOTEL_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/hotels/**
        - id: room-service
          uri: ${HOTEL_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/rooms/**
        - id: booking-service
          uri: ${BOOKING_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/bookings/**
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/payments/**
        - id: review-service
          uri: ${REVIEW_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/reviews/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
