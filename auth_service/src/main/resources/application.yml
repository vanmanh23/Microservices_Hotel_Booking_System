server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/user_db}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin123}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

security:
  jwt:
    token:
      secret-key: ${JWT_SECRET:your-256-bit-secret-key-change-in-production-env}
      access-expire-ms: ${JWT_ACCESS_EXPIRE_MS:900000}
      refresh-expire-ms: ${JWT_REFRESH_EXPIRE_MS:604800000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
