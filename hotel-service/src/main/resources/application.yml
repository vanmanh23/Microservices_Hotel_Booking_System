server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: hotel-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/hotel_db}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin123}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
    redis:
      time-to-live: 300000

management:
  endpoints:
    web:
      exposure:
        include: health,info
